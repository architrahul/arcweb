<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="920" viewBox="0 0 1680 920" role="img" aria-labelledby="title desc">
  <title id="title">PPH Cup measurement system</title>
  <desc id="desc">A vertical symmetric silicone cup connected by tubing from the bottom outlet to the top of a graduated blood collection bag.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fffc"/>
      <stop offset="0.55" stop-color="#edf8f4"/>
      <stop offset="1" stop-color="#fff7f8"/>
    </linearGradient>
    <linearGradient id="silicone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="0.5" stop-color="#dfeee9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b9d2ca" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="siliconeEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fffc"/>
      <stop offset="1" stop-color="#8fb5aa"/>
    </linearGradient>
    <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c73241"/>
      <stop offset="1" stop-color="#7f1323"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0d3b35" flood-opacity="0.15"/>
    </filter>
    <filter id="tubeShadow" x="-12%" y="-40%" width="124%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0d3b35" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1680" height="920" fill="url(#background)"/>
  <rect x="72" y="68" width="1536" height="784" rx="28" fill="#ffffff" fill-opacity="0.72" stroke="#d7e6e1"/>

  <g opacity="0.45">
    <path d="M104 712 C292 644 430 664 573 724 C705 780 880 800 1040 730 C1209 656 1390 636 1578 698" fill="none" stroke="#d9ebe5" stroke-width="2"/>
    <path d="M118 236 C304 278 475 268 624 216 C820 148 1013 154 1194 236 C1324 294 1450 306 1570 270" fill="none" stroke="#efdde2" stroke-width="2"/>
  </g>

