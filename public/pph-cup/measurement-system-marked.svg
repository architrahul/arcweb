      <ellipse cx="220" cy="121" rx="114" ry="44" fill="#f8fffc" stroke="#6f9b91" stroke-width="6"/>
      <ellipse cx="220" cy="126" rx="74" ry="24" fill="#cfded9" fill-opacity="0.5" stroke="#9abcb4" stroke-width="3"/>
