      <text x="226" y="638" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#285850">700 mL</text>
      <path d="M84 112 H432" stroke="#c6ddd6" stroke-width="4" opacity="0.7"/>
