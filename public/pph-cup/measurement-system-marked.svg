      <rect x="184" y="530" width="72" height="42" rx="16" fill="#d9e9e4" stroke="#6f9b91" stroke-width="5"/>
      <rect x="144" y="548" width="64" height="36" rx="18" fill="#d9e9e4" stroke="#6f9b91" stroke-width="5"/>
      <rect x="232" y="548" width="64" height="36" rx="18" fill="#d9e9e4" stroke="#6f9b91" stroke-width="5"/>
      <circle cx="220" cy="570" r="16" fill="#a9182a"/>
